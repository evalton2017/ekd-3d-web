<div class="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl text-slate-200 mt-6">
  <h2 class="text-xl font-bold text-white mb-2">Criar Nova Conta</h2>
  <p class="text-xs text-slate-400 mb-6">Cadastre-se para acessar e gerenciar seu catálogo de impressões 3D.</p>

  @if (erroMensagem()) {
    <div class="bg-rose-500/10 border border-rose-500 text-rose-400 text-sm p-3 rounded-xl mb-4">
      {{ erroMensagem() }}
    </div>
  }

  @if (sucessoMensagem()) {
    <div class="bg-emerald-500/10 border border-emerald-500 text-emerald-400 text-sm p-3 rounded-xl mb-4">
      {{ sucessoMensagem() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" #userForm="ngForm" class="space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Primeiro Nome</label>
        <input type="text" [(ngModel)]="form.firstName" name="firstName" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm focus:border-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Sobrenome</label>
        <input type="text" [(ngModel)]="form.lastName" name="lastName" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm focus:border-blue-500 focus:outline-none">
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Nome de Usuário (Username)</label>
      <input type="text" [(ngModel)]="form.username" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm focus:border-blue-500 focus:outline-none">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">E-mail</label>
      <input type="email" [(ngModel)]="form.email" name="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm focus:border-blue-500 focus:outline-none">
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Senha</label>
        <input type="password" [(ngModel)]="form.password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm focus:border-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Telefone</label>
        <input type="text" [(ngModel)]="form.telefone" name="telefone" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm focus:border-blue-500 focus:outline-none">
      </div>
    </div>

    <div class="pt-4 flex items-center justify-end space-x-3">
      <a routerLink="/home" class="px-4 py-2 text-sm text-slate-400 hover:text-white transition-colors">Cancelar</a>
      <button type="submit" [disabled]="!userForm.form.valid || carregando()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-6 py-2.5 rounded-xl transition-all disabled:opacity-50">
        {{ carregando() ? 'Salvando...' : 'Cadastrar' }}
      </button>
    </div>
  </form>
</div>
