<div class="max-w-3xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl text-slate-200 mt-4 animate-fade-in">

  <!-- Título da Seção -->
  <div class="flex items-center space-x-3 border-b border-slate-800 pb-4 mb-6">
    <div class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
      <svg xmlns="http://w3.org" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    </div>
    <div>
      <h2 class="text-base font-bold text-white leading-none">Painel Administrativo</h2>
      <p class="text-[11px] text-slate-400 mt-1">Inclusão de novos modelos tridimensionais com persistência direta no Object Storage S3</p>
    </div>
  </div>

  <!-- Alertas Condicionais -->
  @if (erroMensagem()) {
    <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-3 rounded-xl mb-4 flex items-center space-x-2">
      <svg xmlns="http://w3.org" class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
      <span>{{ erroMensagem() }}</span>
    </div>
  }

  @if (sucessoMensagem()) {
    <div class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs p-3 rounded-xl mb-4 flex items-center space-x-2">
      <svg xmlns="http://w3.org" class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      <span>{{ sucessoMensagem() }}</span>
    </div>
  }

  <!-- Formulário Multipart -->
  <form (ngSubmit)="onSubmit()" #prodForm="ngForm" class="space-y-5">

    <!-- Linha 1: Nome e Categoria -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="md:col-span-2">
        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1.5">Nome do Modelo 3D</label>
        <input type="text" [(ngModel)]="form.nome" name="nome" required placeholder="Ex: Pokémon Squirtle Articulado" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-blue-500 focus:outline-none transition-colors">
      </div>
      <div>
        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1.5">Categoria</label>
        <select [(ngModel)]="form.categoriaId" name="categoriaId" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-blue-500 focus:outline-none transition-colors">
          <option [value]="null" disabled selected>Selecione...</option>
          @for (cat of categorias(); track cat.id) {
            <option [value]="cat.id">{{ cat.nome }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Linha 2: Descrição e Preço -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="md:col-span-3">
        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1.5">Descrição Curta</label>
        <input type="text" [(ngModel)]="form.descricao" name="descricao" required placeholder="Ex: Modelo impresso em filamento PETG de alta fidelidade..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-blue-500 focus:outline-none transition-colors">
      </div>
      <div>
        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1.5">Preço Base (R$)</label>
        <input type="number" [(ngModel)]="form.precoBase" name="precoBase" required min="0.01" step="0.01" placeholder="0,00" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-blue-500 focus:outline-none transition-colors">
      </div>
    </div>

    <!-- Linha 3: Gerenciamento Flutuante de Upload de Mídias -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">

      <!-- Upload da Imagem de Preview -->
      <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-4 flex flex-col items-center justify-center text-center group border-dashed hover:border-slate-700 transition-colors">
        <svg xmlns="http://w3.org" class="w-8 h-8 text-slate-600 group-hover:text-blue-500 transition-colors mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
        <span class="text-[11px] font-medium text-slate-300 block max-w-[220px] truncate mb-2">{{ nomeImagem() }}</span>
        <label class="cursor-pointer bg-slate-900 border border-slate-700 hover:bg-slate-800 text-[10px] font-bold text-white px-3 py-1.5 rounded-lg transition-all active:scale-95">
          Escolher Imagem
          <input type="file" (change)="onImagemChange($event)" accept="image/*" class="hidden">
        </label>
      </div>

      <!-- Upload do Arquivo de Malha 3D (.stl / .3mf) -->
      <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-4 flex flex-col items-center justify-center text-center group border-dashed hover:border-slate-700 transition-colors">
        <svg xmlns="http://w3.org" class="w-8 h-8 text-slate-600 group-hover:text-blue-500 transition-colors mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5" /></svg>
        <span class="text-[11px] font-medium text-slate-300 block max-w-[220px] truncate mb-2">{{ nomeArquivo3d() }}</span>
        <label class="cursor-pointer bg-slate-900 border border-slate-700 hover:bg-slate-800 text-[10px] font-bold text-white px-3 py-1.5 rounded-lg transition-all active:scale-95">
          Escolher Arquivo 3D
          <input type="file" (change)="onArquivo3dChange($event)" accept=".stl,.3mf" class="hidden">
        </label>
      </div>

    </div>

    <!-- Botões de Ação Inferiores -->
    <div class="pt-4 border-t border-slate-800 flex items-center justify-end space-x-3 w-full">
      <a [routerLink]="['/home']" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white transition-colors">Cancelar</a>
      <button type="submit"
              [disabled]="!prodForm.form.valid || !imagemSelecionada || !arquivo3dSelecionado || carregando()"
              class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition-all disabled:opacity-40 disabled:hover:bg-blue-600 shadow-lg shadow-blue-500/10 active:scale-95 inline-flex items-center space-x-1.5">
        @if (carregando()) {
          <svg class="animate-spin h-3.5 w-3.5 text-white" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Enviando Mídias...</span>
        } @else {
          <span>Salvar Produto</span>
        }
      </button>
    </div>

  </form>
</div>
