<div class="flex flex-col h-screen w-full overflow-hidden bg-slate-950">

  <!-- Header fixo no topo -->
  <app-header class="block w-full relative z-50"></app-header>

  <!-- Área do corpo da aplicação (Sidebar + Conteúdo da Rota) -->
  <div class="flex flex-1 w-full overflow-hidden relative z-10">

    <app-sidebar
      [class.w-0]="true"
      [class.md:w-64]="layoutService.isDesktopExpanded()"
      [class.md:w-20]="!layoutService.isDesktopExpanded()"
      class="flex flex-col transition-all duration-300 ease-in-out">
    </app-sidebar>

    <!-- Painel da direita modificado para rolar o conteúdo junto com o Footer -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-950 text-slate-100 flex flex-col min-h-full">

      <!-- Área interna com espaçamento para as páginas da rota -->
      <div class="p-6 flex-1">
        <router-outlet></router-outlet>
      </div>

      <!-- RENDERIZAÇÃO DO SEU NOVO FOOTER NO RODAPÉ -->
      <app-footer></app-footer>

    </main>

  </div>
</div>
