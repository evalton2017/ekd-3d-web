<!-- SIDEBAR DESKTOP -->
<aside class="w-full flex flex-col min-h-screen bg-slate-900 text-slate-300 border-r border-slate-800 overflow-hidden">

  <div class="p-4 font-bold text-[10px] uppercase tracking-wider text-slate-500 border-b border-slate-800 whitespace-nowrap">
    {{ layoutService.isDesktopExpanded() ? 'Navegação Principal' : 'MENU' }}
  </div>

  <nav class="flex-1 px-3 py-4 space-y-2">
    @for (item of menuFiltrado; track item.label) {
      <a [routerLink]="item.route"
         routerLinkActive="bg-blue-600 text-white shadow-lg"
         [title]="item.label"
         class="flex items-center p-3 rounded-xl text-sm font-medium transition-all hover:bg-slate-800 hover:text-white group whitespace-nowrap">
        <i class="material-icons text-slate-400 group-hover:text-white transition-colors"
           [class.mr-3]="layoutService.isDesktopExpanded()">{{ item.icon }}</i>
        <span class="transition-opacity duration-200" [class.opacity-0]="!layoutService.isDesktopExpanded()">
          {{ item.label }}
        </span>
      </a>
    }
  </nav>
</aside>
